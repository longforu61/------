<!DOCTYPE html>
<!--
  ============================================
  个人名片网页 —— HTML 结构文件
  作者：Cline
  说明：仅包含结构语义，样式全部写在 style.css
  ============================================
-->
<html lang="zh-CN">
<head>
    <!-- 字符集声明：支持中文等 UTF-8 字符 -->
    <meta charset="UTF-8">
    <!-- 移动端自适应：使页面在手机上也舒适显示 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 页面标题（浏览器标签页上显示） -->
    <title>个人名片 - 简约风格</title>
    <!-- 引入独立的外部样式表（HTML 与 CSS 分离） -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 主容器：居中卡片式布局 -->
  <article class="card">

    <!-- 头像区域：渐变圆形 + 姓名首字母 -->
    <div class="avatar" aria-hidden="true">陈</div>

    <!-- 个人信息区域 -->
    <div class="info">
      <!-- 姓名 -->
      <h1 class="name">陈晓明</h1>
      <!-- 职位描述 -->
      <p class="role">前端开发工程师</p>

      <!-- 联系方式列表 -->
      <ul class="contact">
        <!-- 电话 -->
        <li>
          <!-- 内联 SVG 电话图标（不依赖外部字体库） -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.37 1.9.72 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.35 1.85.6 2.81.72A2 2 0 0 1 22 16.92z"/>
          </svg>
          <a href="tel:+8613800123456">+86 138-0012-3456</a>
        </li>
        <!-- 邮箱 -->
        <li>
          <!-- 内联 SVG 邮箱图标 -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="m22 7-10 6L2 7"/>
          </svg>
          <a href="mailto:cxiaoming@example.com">cxiaoming@example.com</a>
        </li>
        <!-- 地址 -->
        <li>
          <!-- 内联 SVG 定位图标 -->
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span>北京市 · 海淀区</span>
        </li>
      </ul>
    </div>
  </article>
</body>
</html>
